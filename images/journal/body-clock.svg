<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="The Traditional Chinese Medicine body clock: a twelve-segment dial naming the organ system that runs in each two-hour window of the day, with one to three in the morning, the Liver, marked">
  <rect width="400" height="300" fill="#F4F3EF"/>

  <!-- the marked window: 1 to 3 AM, the Liver -->
  <path d="M200.0 152.0 L217.1 88.2 A66.0 66.0 0 0 1 246.7 105.3 Z" fill="#8C2E22" fill-opacity=".08"/>

  <!-- twelve two-hour segments -->
  <g stroke="#DDDCD6" stroke-width="1">
    <path d="M200.0 152.0 L217.1 88.2 M200.0 152.0 L246.7 105.3 M200.0 152.0 L263.8 134.9 M200.0 152.0 L263.8 169.1 M200.0 152.0 L246.7 198.7 M200.0 152.0 L217.1 215.8 M200.0 152.0 L182.9 215.8 M200.0 152.0 L153.3 198.7 M200.0 152.0 L136.2 169.1 M200.0 152.0 L136.2 134.9 M200.0 152.0 L153.3 105.3 M200.0 152.0 L182.9 88.2"/>
  </g>
  <circle cx="200.0" cy="152.0" r="66.0" fill="none" stroke="#CFCEC7" stroke-width="1"/>

  <path d="M217.1 88.2 A66.0 66.0 0 0 1 246.7 105.3" fill="none" stroke="#8C2E22" stroke-width="2.5"/>
  <path d="M200.0 152.0 L217.1 88.2 M200.0 152.0 L246.7 105.3" stroke="#8C2E22" stroke-width="1" stroke-opacity=".55"/>
  <circle cx="200.0" cy="152.0" r="2.5" fill="#8C8C86"/>

  <!-- organ systems and the hours they run -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="200.0" y="65.0" text-anchor="middle" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">GALLBLADDER</text>
    <text x="200.0" y="77.0" text-anchor="middle" font-size="8" letter-spacing=".3" fill="#9A9992">11 PM–1 AM</text>
    <text x="239.0" y="82.5" text-anchor="start" font-size="9.2" letter-spacing=".7" font-weight="600" fill="#8C2E22">LIVER</text>
    <text x="239.0" y="94.5" text-anchor="start" font-size="8" letter-spacing=".3" fill="#8C2E22">1–3 AM</text>
    <text x="267.5" y="111.0" text-anchor="start" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">LUNG</text>
    <text x="267.5" y="123.0" text-anchor="start" font-size="8" letter-spacing=".3" fill="#9A9992">3–5 AM</text>
    <text x="278.0" y="150.0" text-anchor="start" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">LARGE INTESTINE</text>
    <text x="278.0" y="162.0" text-anchor="start" font-size="8" letter-spacing=".3" fill="#9A9992">5–7 AM</text>
    <text x="267.5" y="189.0" text-anchor="start" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">STOMACH</text>
    <text x="267.5" y="201.0" text-anchor="start" font-size="8" letter-spacing=".3" fill="#9A9992">7–9 AM</text>
    <text x="239.0" y="217.5" text-anchor="start" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">SPLEEN</text>
    <text x="239.0" y="229.5" text-anchor="start" font-size="8" letter-spacing=".3" fill="#9A9992">9–11 AM</text>
    <text x="200.0" y="232.0" text-anchor="middle" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">HEART</text>
    <text x="200.0" y="244.0" text-anchor="middle" font-size="8" letter-spacing=".3" fill="#9A9992">11 AM–1 PM</text>
    <text x="161.0" y="217.5" text-anchor="end" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">SMALL INTESTINE</text>
    <text x="161.0" y="229.5" text-anchor="end" font-size="8" letter-spacing=".3" fill="#9A9992">1–3 PM</text>
    <text x="132.5" y="189.0" text-anchor="end" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">BLADDER</text>
    <text x="132.5" y="201.0" text-anchor="end" font-size="8" letter-spacing=".3" fill="#9A9992">3–5 PM</text>
    <text x="122.0" y="150.0" text-anchor="end" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">KIDNEY</text>
    <text x="122.0" y="162.0" text-anchor="end" font-size="8" letter-spacing=".3" fill="#9A9992">5–7 PM</text>
    <text x="132.5" y="111.0" text-anchor="end" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">PERICARDIUM</text>
    <text x="132.5" y="123.0" text-anchor="end" font-size="8" letter-spacing=".3" fill="#9A9992">7–9 PM</text>
    <text x="161.0" y="82.5" text-anchor="end" font-size="9.2" letter-spacing=".7" font-weight="500" fill="#5F5E58">TRIPLE BURNER</text>
    <text x="161.0" y="94.5" text-anchor="end" font-size="8" letter-spacing=".3" fill="#9A9992">9–11 PM</text>
  </g>
</svg>
