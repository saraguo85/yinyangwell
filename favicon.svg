<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile{fill:#F4F3EF}
    .mark{fill:#1A1A1A}
    .hole{fill:#F4F3EF}
    .ring{stroke:#1A1A1A}
    @media (prefers-color-scheme: dark){
      .tile{fill:#1A1A1A}
      .mark{fill:#F4F3EF}
      .hole{fill:#1A1A1A}
      .ring{stroke:#F4F3EF}
    }
  </style>
  <rect class="tile" width="64" height="64" rx="2"/>
  <!-- Yin-yang, drawn as one path so it stays legible at 16px -->
  <path class="mark" d="M32 12a20 20 0 0 0 0 40 10 10 0 0 1 0-20 10 10 0 0 0 0-20z"/>
  <circle class="hole" cx="32" cy="22" r="3.4"/>
  <circle class="mark" cx="32" cy="42" r="3.4"/>
  <circle class="ring" cx="32" cy="32" r="20" fill="none" stroke-width="2.5"/>
</svg>
