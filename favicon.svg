<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile{fill:#F4F3EF}
    .mark{fill:#1A1A1A}
    .hole{fill:#F4F3EF}
    .ring{stroke:#1A1A1A}
    @media (prefers-color-scheme: dark){
      .tile{fill:#1A1A1A}
      .mark{fill:#F4F3EF}
      .hole{fill:#1A1A1A}
      .ring{stroke:#F4F3EF}
    }
  </style>
  <rect class="tile" width="64" height="64" rx="2"/>
  <!-- Yin-yang, drawn as one path so it stays legible at 16px -->
  <path class="mark" d="M32 6a26 26 0 0 0 0 52 13 13 0 0 1 0-26 13 13 0 0 0 0-26z"/>
  <circle class="hole" cx="32" cy="19" r="4.4"/>
  <circle class="mark" cx="32" cy="45" r="4.4"/>
  <circle class="ring" cx="32" cy="32" r="26" fill="none" stroke-width="2.8"/>
</svg>
