<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>手机预览</title>
<style>
body{margin:0;background:#2b2b2b;font-family:-apple-system,sans-serif;color:#eee;display:flex;flex-direction:column;align-items:center;padding:16px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
select,button{font-size:14px;padding:6px 10px;border-radius:6px;border:0}
.phone{background:#111;border-radius:44px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
iframe{display:block;border:0;border-radius:32px;background:#fff}
</style></head><body>
<div class="bar">
  <select id="pg">
    <option>index.html</option><option>services.html</option><option>service-constitution-report.html</option>
    <option>service-observation-reading.html</option><option>sessions-in-china.html</option><option>practitioners.html</option>
    <option>about.html</option><option>tcm-lens.html</option><option>journal.html</option><option>journal-summer-solstice.html</option>
    <option>article-waking-at-3am.html</option><option>faq.html</option><option>contact.html</option><option>terms.html</option>
  </select>
  <select id="dev">
    <option value="390x844">iPhone 14/15 (390)</option><option value="375x667">iPhone SE (375)</option>
    <option value="430x932">iPhone Pro Max (430)</option><option value="360x780">Android (360)</option>
  </select>
  <button onclick="f.contentWindow.location.reload()">刷新</button>
</div>
<div class="phone"><iframe id="f" width="390" height="844"></iframe></div>
<script>
const f=document.getElementById('f'),pg=document.getElementById('pg'),dev=document.getElementById('dev');
function go(){f.src='../'+pg.value}
function size(){const[w,h]=dev.value.split('x');f.width=w;f.height=h}
pg.onchange=go;dev.onchange=size;size();go();
</script>
</body></html>
